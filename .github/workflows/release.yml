name: Release

# Publishes @tessera-design/tokens and @tessera-design/react to npm with provenance.
# - Pending changesets on main: opens (or updates) a "Version packages" PR. Merging it publishes.
# - No pending changesets and an unpublished version in package.json: publishes it.
# Needs an npm automation token in the NPM_TOKEN secret. Without it, this job only leaves a notice.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check before publishing
        if: env.HAS_NPM_TOKEN == 'true'
        run: npm run typecheck && npm test
      - name: Version PR or publish
        if: env.HAS_NPM_TOKEN == 'true'
        uses: changesets/action@v1
        with:
          version: npx changeset version
          publish: npm run release
          title: Version packages
          commit: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
      - name: No token yet
        if: env.HAS_NPM_TOKEN != 'true'
        run: echo "::notice title=Not published::Add an npm automation token as the NPM_TOKEN repository secret to publish @tessera-design/tokens and @tessera-design/react."
